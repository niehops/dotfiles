# remove default keybindings
unbind-key -a

# Session
bind d detach
bind S choose-session
bind C display-message "Clients: #{client_count}"

# Windows
bind c new-window -c "$HOME"
bind H previous-window
bind L next-window

bind A last-window

bind w list-windows
bind W list-windows

bind '"' choose-window 
bind r command-prompt "rename-window %%"
bind N command-prompt "rename-session %%"

bind R source-file ~/.config/tmux/tmux.conf \;\
  display-message "tmux.conf reloaded"

# direct window selection 
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# panes 
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# split pane
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

bind z resize-pane -Z # zoom
bind x kill-pane # kill pane

bind X swap-pane -D 

# resize pane 
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up resize-pane -U 5
bind -r C-down resize-pane -D 5

# synchronize panes
bind '*' setw synchronize-panes

bind P set pane-border-status
bind K send-keys "clear" Enter
bind C-l refresh-client #refresh

# command prompt 
bind : command-prompt

# copy mode
bind C-v copy-mode # enter tmux copy mode
bind-key -T copy-mode-vi v \
  send-keys -X begin-selection

bind-key -T copy-mode-vi V \
  send-keys -X select-line

bind-key -T copy-mode-vi y \
  send-keys -X copy-selection-and-cancel

bind-key -T copy-mode-vi Escape \
  send-keys -X cancel

# copy mode navigation
bind-key -T copy-mode-vi h send-keys -X cursor-left
bind-key -T copy-mode-vi j send-keys -X cursor-down
bind-key -T copy-mode-vi k send-keys -X cursor-up
bind-key -T copy-mode-vi l send-keys -X cursor-right

bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down

# opencode 
bind O popup \
  -E \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  "opencode"

# workmux
bind D display-popup -E -w 90% -h 90% "workmux dashboard"
